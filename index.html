<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <!-- PWA instalável (manifest só — SEM service worker de propósito: cache de SW
         já causou site desatualizado neste projeto; o ganho aqui é o "instalar app"
         com ícone/standalone, sem risco de servir versão velha) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- (preload de banner REMOVIDO: o banner real é servido via wsrv com URL
         dinâmica do Supabase — o preload hardcoded nunca batia com a URL renderizada
         e baixava um PNG full-res de vários MB à toa em toda visita. O skeleton do
         BannerImage cobre o carregamento.) -->
    <!-- Preconnect para reduzir handshake TLS nas requisições críticas -->
    <link rel="preconnect" href="https://tapgnlrjhrhewqlpahvg.supabase.co" crossorigin />
    <!-- wsrv.nl serve TODAS as imagens de produto: preconnect (TLS quente) acelera o 1º paint -->
    <link rel="preconnect" href="https://wsrv.nl" crossorigin />
    <link rel="dns-prefetch" href="https://wsrv.nl" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Anton&family=DM+Sans:wght@800&display=swap" rel="stylesheet" />
    <!-- Preload das 2 PRIMEIRAS imagens do grid, com a URL EXATA que ESTE
         aparelho renderizou na visita anterior (currentSrc salvo pelo App em
         @fluxo:preload-imgs-v1). Começa o download junto com o JS em vez de
         esperar a cascata JS→React→catálogo→<img> (~2,5s medidos 2026-07-13).
         Diferente do preload de banner removido acima, aqui a URL nunca
         "não bate": é a própria URL da última renderização. SEM crossorigin
         de propósito — o <img> do card também não tem (par preload↔uso tem
         que casar, senão baixa dobrado). Host preso em wsrv.nl/supabase. -->
    <script>
      try {
        JSON.parse(localStorage.getItem('@fluxo:preload-imgs-v1') || '[]').slice(0, 2).forEach(function (u) {
          if (typeof u !== 'string') return;
          if (u.indexOf('https://wsrv.nl/') !== 0 && u.indexOf('https://tapgnlrjhrhewqlpahvg.supabase.co/') !== 0) return;
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.href = u; l.fetchPriority = 'high';
          document.head.appendChild(l);
        });
      } catch (e) { /* sem localStorage/JSON ruim: segue sem preload */ }
    </script>
    <title>FLUXO OUTLET</title>
    <meta name="description" content="⚡ Peças premium selecionadas, coleções limitadas e envio para todo o Brasil. Escolha no catálogo e finalize pelo WhatsApp. 🔥" />
    <meta name="facebook-domain-verification" content="bgaf2lgex6xoha59ns7cezhtvh147q" />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:title" content="Fluxo Outlet | Streetwear Premium" />
    <meta property="og:description" content="⚡ Peças premium selecionadas, coleções limitadas e envio para todo o Brasil. Escolha no catálogo e finalize pelo WhatsApp. 🔥" />
    <meta property="og:url" content="https://fluxooutlet.com.br" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://fluxooutlet.com.br/og-image.jpg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Fluxo Outlet — Streetwear Premium" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Fluxo Outlet" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fluxo Outlet | Streetwear Premium" />
    <meta name="twitter:description" content="⚡ Peças premium selecionadas, coleções limitadas e envio para todo o Brasil. Escolha no catálogo e finalize pelo WhatsApp. 🔥" />
    <meta name="twitter:image" content="https://fluxooutlet.com.br/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
